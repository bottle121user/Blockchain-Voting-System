version: '3.8'

services:
  # 1. PostgreSQL Relational Database (Production Storage Engine)
  postgres:
    image: postgres:16-alpine
    container_name: chainvote-postgres
    restart: always
    environment:
      POSTGRES_USER: chainvote_admin
      POSTGRES_PASSWORD: secure_postgres_password_123
      POSTGRES_DB: chainvote
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - chainvote-network

  # 2. Express.js Backend API & Blockchain Relayer Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chainvote-backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: postgres://chainvote_admin:secure_postgres_password_123@postgres:5432/chainvote
      RPC_URL: http://host.docker.internal:8546
      ADMIN_PRIVATE_KEY: "0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d"
      CONTRACT_ADDRESS: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
      JWT_SECRET: "chainvote_production_secret_key_2026"
      ADMIN_PASSWORD: "admin123"
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    networks:
      - chainvote-network

  # 3. Next.js Web Client (Voter Portal, Admin Console & Public Audit Explorer)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chainvote-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - chainvote-network

volumes:
  pgdata:
    driver: local

networks:
  chainvote-network:
    driver: bridge
